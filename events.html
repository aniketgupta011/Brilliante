<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upcoming Events — Chess Club</title>
  <meta name="description" content="Browse upcoming chess tournaments, workshops, and events hosted by the University Chess Club." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.7s ease-out, transform 0.7s ease-out; }
    .reveal.active { opacity: 1; transform: translateY(0); }
    .nav-link::after {
      content: ''; display: block; width: 0; height: 2px;
      background: #fff; transition: width 0.3s ease;
    }
    .nav-link:hover::after, .nav-link.active::after { width: 100%; }

    /* Skeleton shimmer */
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
      background-size: 400px 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 8px;
    }
    /* Event badge colours */
    .badge-ongoing  { background: rgba(34,197,94,0.12); color: #4ade80; border-color: rgba(74,222,128,0.3); }
    .badge-upcoming { background: rgba(59,130,246,0.12); color: #60a5fa; border-color: rgba(96,165,250,0.3); }

    /* Admin panel inputs */
    .admin-input {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      width: 100%;
      font-size: 13px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .admin-input:focus {
      border-color: rgba(255,255,255,0.4);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
    }
    .admin-input::placeholder { color: #525252; }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      padding: 12px 24px; border-radius: 10px; font-size: 13px; font-weight: 500;
      z-index: 999; transition: transform 0.3s ease, opacity 0.3s ease; opacity: 0;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.success { background: #1a2e1a; border: 1px solid rgba(74,222,128,0.3); color: #4ade80; }
    #toast.error   { background: #2e1a1a; border: 1px solid rgba(239,68,68,0.3); color: #f87171; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,0.2); border-top-color: #000;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
  </style>
</head>
<body class="bg-black text-white font-sans antialiased">

  <!-- ============ HEADER ============ -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-black/80 backdrop-blur-md border-b border-neutral-800/60">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 group">
        <img src="sports club transparent.png" alt="Sports Club Logo" class="h-9 w-auto transition-transform group-hover:scale-105" />
      </a>
      <nav class="hidden md:flex items-center gap-8">
        <a href="index.html" class="nav-link text-sm font-medium tracking-wide uppercase text-neutral-400 hover:text-white transition-colors pb-0.5">Home</a>
        <a href="events.html" class="nav-link active text-sm font-medium tracking-wide uppercase pb-0.5">Events</a>
        <a href="leaders.html" class="nav-link text-sm font-medium tracking-wide uppercase text-neutral-400 hover:text-white transition-colors pb-0.5">Leaders</a>
        <a href="join.html" class="nav-link text-sm font-medium tracking-wide uppercase text-neutral-400 hover:text-white transition-colors pb-0.5">Join</a>
      </nav>
      <div class="hidden md:flex items-center justify-center h-10" title="Adamas University">
        <img src="au_logo.png" alt="Adamas University Logo" class="h-10 w-auto object-contain" />
      </div>
      <button id="menuBtn" class="md:hidden flex flex-col gap-1.5 p-2" aria-label="Toggle navigation">
        <span class="block w-6 h-0.5 bg-white transition-all" id="bar1"></span>
        <span class="block w-6 h-0.5 bg-white transition-all" id="bar2"></span>
        <span class="block w-6 h-0.5 bg-white transition-all" id="bar3"></span>
      </button>
    </div>
    <div id="mobileMenu" class="md:hidden hidden border-t border-neutral-800/60 bg-black/95 backdrop-blur-md">
      <nav class="flex flex-col px-6 py-4 gap-4">
        <a href="index.html" class="text-sm font-medium tracking-wide uppercase text-neutral-400 hover:text-white transition-colors">Home</a>
        <a href="events.html" class="text-sm font-medium tracking-wide uppercase text-white">Events</a>
        <a href="leaders.html" class="text-sm font-medium tracking-wide uppercase text-neutral-400 hover:text-white transition-colors">Leaders</a>
        <a href="join.html" class="text-sm font-medium tracking-wide uppercase text-neutral-400 hover:text-white transition-colors">Join</a>
      </nav>
    </div>
  </header>

  <!-- ============ PAGE CONTENT ============ -->
  <main class="pt-28 pb-20 px-6">
    <div class="max-w-5xl mx-auto">

      <!-- Section Header -->
      <div class="text-center mb-16 reveal">
        <h1 class="text-4xl md:text-5xl font-black tracking-[0.15em] uppercase mb-4">Upcoming Events</h1>
        <div class="w-16 h-px bg-neutral-700 mx-auto mb-6"></div>
        <p class="text-neutral-400 text-lg max-w-xl mx-auto">Fixtures, tournaments, and workshops on the calendar. Don't miss a move.</p>
      </div>

      <!-- ─── ADMIN PANEL (hidden by default, shown for admin/president) ─── -->
      <div id="admin-panel" class="hidden mb-12">
        <div class="bg-neutral-900/80 border border-neutral-800 rounded-2xl p-6 md:p-8 reveal">
          <div class="flex items-center gap-3 mb-6">
            <span class="text-2xl">♛</span>
            <h2 class="text-lg font-bold uppercase tracking-wider">Admin Panel</h2>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Add Event Form -->
            <div class="bg-black/40 border border-neutral-800 rounded-xl p-5">
              <h3 class="text-sm font-bold uppercase tracking-widest text-neutral-400 mb-4">Add Event</h3>
              <form id="add-event-form" class="space-y-3">
                <div>
                  <label class="block text-xs text-neutral-500 uppercase tracking-widest mb-1">Title <span class="text-red-500">*</span></label>
                  <input type="text" id="event-title" class="admin-input" placeholder="e.g. Blitz Tournament #3" required />
                </div>
                <div>
                  <label class="block text-xs text-neutral-500 uppercase tracking-widest mb-1">Description</label>
                  <textarea id="event-desc" class="admin-input" rows="2" placeholder="Optional description..."></textarea>
                </div>
                <div>
                  <label class="block text-xs text-neutral-500 uppercase tracking-widest mb-1">Start Date & Time <span class="text-red-500">*</span></label>
                  <input type="datetime-local" id="event-start" class="admin-input" required />
                </div>
                <div class="flex items-center gap-3">
                  <input type="checkbox" id="event-ongoing" class="w-4 h-4 accent-white" />
                  <label for="event-ongoing" class="text-xs text-neutral-400 uppercase tracking-widest">Mark as Live / Ongoing</label>
                </div>
                <button type="submit" id="event-submit-btn" class="w-full bg-white text-black font-semibold text-xs tracking-wider uppercase py-2.5 rounded-lg hover:bg-neutral-200 transition-all cursor-pointer">
                  Create Event
                </button>
              </form>
            </div>

            <!-- Add YouTube Stream Form -->
            <div class="bg-black/40 border border-neutral-800 rounded-xl p-5">
              <h3 class="text-sm font-bold uppercase tracking-widest text-neutral-400 mb-4">Add YouTube Stream</h3>
              <form id="add-stream-form" class="space-y-3">
                <div>
                  <label class="block text-xs text-neutral-500 uppercase tracking-widest mb-1">Title <span class="text-red-500">*</span></label>
                  <input type="text" id="stream-title" class="admin-input" placeholder="e.g. Club Finals Live" required />
                </div>
                <div>
                  <label class="block text-xs text-neutral-500 uppercase tracking-widest mb-1">YouTube URL <span class="text-red-500">*</span></label>
                  <input type="url" id="stream-url" class="admin-input" placeholder="https://youtube.com/watch?v=..." required />
                </div>
                <button type="submit" id="stream-submit-btn" class="w-full bg-white text-black font-semibold text-xs tracking-wider uppercase py-2.5 rounded-lg hover:bg-neutral-200 transition-all cursor-pointer">
                  Add Stream
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Events Grid — populated by JS -->
      <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Skeleton cards while loading -->
        <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-6">
          <div class="skeleton h-5 w-24 mb-4"></div>
          <div class="skeleton h-6 w-3/4 mb-6"></div>
          <div class="skeleton h-4 w-1/2 mb-2"></div>
          <div class="skeleton h-4 w-2/5 mb-6"></div>
          <div class="skeleton h-9 w-32"></div>
        </div>
        <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-6">
          <div class="skeleton h-5 w-24 mb-4"></div>
          <div class="skeleton h-6 w-3/4 mb-6"></div>
          <div class="skeleton h-4 w-1/2 mb-2"></div>
          <div class="skeleton h-4 w-2/5 mb-6"></div>
          <div class="skeleton h-9 w-32"></div>
        </div>
      </div>

      <!-- Error / empty state -->
      <div id="events-error" class="hidden text-center py-16">
        <div class="text-4xl mb-4">♞</div>
        <p class="text-neutral-500 text-sm" id="events-error-msg">Could not load events.</p>
      </div>

    </div>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="border-t border-neutral-800/60 py-10 px-6">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
      <p class="text-neutral-500 text-sm">&copy; 2026 Chess Club &mdash; All rights reserved.</p>
      <div class="flex items-center gap-5">
        <a href="https://github.com/aniketgupta011" class="text-neutral-500 hover:text-white transition-colors" aria-label="GitHub">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        </a>
        <a href="https://www.instagram.com/adamasuniversity_sportsclub/" class="text-neutral-500 hover:text-white transition-colors" aria-label="Instagram">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
        </a>
        <a href="mailto:chess@university.edu" class="text-neutral-500 hover:text-white transition-colors" aria-label="Email">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg>
        </a>
      </div>
    </div>
  </footer>

  <!-- Toast notification -->
  <div id="toast" role="alert" aria-live="polite"></div>

  <!-- ============ JS ============ -->
  <script>
    // ── Config ────────────────────────────────────────────────────────────────
    const API_BASE = 'https://brilliante.onrender.com';

    // ── Auth helpers ─────────────────────────────────────────────────────────
    function getAuth() {
      try {
        const raw = localStorage.getItem('brilliante_auth');
        if (!raw) return null;
        const auth = JSON.parse(raw);
        if (auth.token) {
          const payload = JSON.parse(atob(auth.token.split('.')[1]));
          if (payload.exp * 1000 < Date.now()) {
            localStorage.removeItem('brilliante_auth');
            return null;
          }
        }
        return auth;
      } catch { return null; }
    }

    function logout() {
      localStorage.removeItem('brilliante_auth');
      window.location.reload();
    }

    function isAdmin() {
      const auth = getAuth();
      return auth && (auth.role === 'admin' || auth.role === 'president');
    }

    function updateNavForAuth() {
      const auth = getAuth();
      if (!auth) return;

      document.querySelectorAll('nav.hidden.md\\:flex a[href="join.html"]').forEach(el => {
        const btn = document.createElement('button');
        btn.textContent = 'Logout';
        btn.className = 'nav-link text-sm font-medium tracking-wide uppercase text-neutral-400 hover:text-white transition-colors pb-0.5 bg-transparent border-none cursor-pointer';
        btn.addEventListener('click', logout);
        el.replaceWith(btn);
      });

      document.querySelectorAll('#mobileMenu a[href="join.html"]').forEach(el => {
        const btn = document.createElement('button');
        btn.textContent = 'Logout';
        btn.className = 'text-sm font-medium tracking-wide uppercase text-neutral-400 hover:text-white transition-colors bg-transparent border-none cursor-pointer text-left';
        btn.addEventListener('click', logout);
        el.replaceWith(btn);
      });
    }

    // ── Toast ─────────────────────────────────────────────────────────────────
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `show ${type}`;
      setTimeout(() => { t.className = type; }, 3500);
    }

    // ── Mobile menu ───────────────────────────────────────────────────────────
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const bar1 = document.getElementById('bar1');
    const bar2 = document.getElementById('bar2');
    const bar3 = document.getElementById('bar3');
    let menuOpen = false;
    menuBtn.addEventListener('click', () => {
      menuOpen = !menuOpen;
      mobileMenu.classList.toggle('hidden');
      bar1.style.transform = menuOpen ? 'rotate(45deg) translate(4px, 4px)' : '';
      bar2.style.opacity = menuOpen ? '0' : '1';
      bar3.style.transform = menuOpen ? 'rotate(-45deg) translate(4px, -4px)' : '';
    });

    // ── Scroll-reveal ─────────────────────────────────────────────────────────
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('active'); observer.unobserve(e.target); } });
    }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // ── Apply auth state ──────────────────────────────────────────────────────
    updateNavForAuth();

    // ── Show admin panel if user is admin/president ───────────────────────────
    if (isAdmin()) {
      const adminPanel = document.getElementById('admin-panel');
      adminPanel.classList.remove('hidden');
      adminPanel.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    const EVENT_ICONS = ['⚡', '🏆', '📖', '♔', '♟', '⚔️', '🎯', '👑'];

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
    }
    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
    }
    function buildCalendarUrl(event) {
      const start = new Date(event.start_time);
      const end = new Date(start.getTime() + 2 * 60 * 60 * 1000); // +2h default
      const fmt = d => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      return `https://calendar.google.com/calendar/render?action=TEMPLATE`
        + `&text=${encodeURIComponent(event.title)}`
        + `&details=${encodeURIComponent(event.description || '')}`
        + `&dates=${fmt(start)}/${fmt(end)}`;
    }

    function renderEventCard(event, index) {
      const icon = EVENT_ICONS[index % EVENT_ICONS.length];
      const badge = event.is_ongoing
        ? `<span class="badge-ongoing text-xs font-semibold border rounded-full px-2.5 py-0.5">● Live Now</span>`
        : `<span class="badge-upcoming text-xs font-semibold border rounded-full px-2.5 py-0.5">Upcoming</span>`;

      const deleteBtn = isAdmin()
        ? `<button onclick="deleteEvent(${event.id})" class="inline-flex items-center gap-1.5 text-xs font-medium text-red-400 border border-red-900/40 rounded-lg px-3 py-2 hover:bg-red-500/10 transition-all bg-transparent cursor-pointer ml-2">
             <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
             Delete
           </button>`
        : '';

      return `
        <article class="group bg-neutral-900 border border-neutral-800 rounded-xl p-6 hover:border-neutral-600 transition-all duration-300 hover:-translate-y-1 reveal">
          <div class="flex items-start justify-between mb-4">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 bg-white/5 border border-neutral-700 rounded-lg flex items-center justify-center text-xl flex-shrink-0">${icon}</div>
              <div>
                <h2 class="text-lg font-bold leading-snug">${escHtml(event.title)}</h2>
              </div>
            </div>
            ${badge}
          </div>
          ${event.description ? `<p class="text-sm text-neutral-400 mb-5 leading-relaxed line-clamp-2">${escHtml(event.description)}</p>` : ''}
          <div class="space-y-2 mb-6">
            <div class="flex items-center gap-2 text-sm text-neutral-400">
              <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"/></svg>
              <span>${formatDate(event.start_time)}</span>
            </div>
            <div class="flex items-center gap-2 text-sm text-neutral-400">
              <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <span>${formatTime(event.start_time)}</span>
            </div>
          </div>
          <div class="flex items-center flex-wrap gap-2">
            <a href="${buildCalendarUrl(event)}" target="_blank" rel="noopener"
               class="inline-flex items-center gap-2 text-sm font-medium text-white border border-neutral-700 rounded-lg px-4 py-2 hover:bg-white hover:text-black transition-all">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
              Add to Calendar
            </a>
            ${deleteBtn}
          </div>
        </article>`;
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Delete event (admin only) ─────────────────────────────────────────────
    async function deleteEvent(eventId) {
      if (!confirm('Delete this event? This cannot be undone.')) return;
      const auth = getAuth();
      if (!auth) return;

      try {
        const res = await fetch(`${API_BASE}/events/${eventId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${auth.token}` },
        });
        if (res.ok) {
          showToast('Event deleted.');
          loadEvents(); // Refresh the grid
        } else {
          const data = await res.json();
          showToast(data.detail || 'Failed to delete event.', 'error');
        }
      } catch (err) {
        showToast('Network error. Could not delete event.', 'error');
        console.error('Delete event error:', err);
      }
    }

    // ── Fetch & render events ─────────────────────────────────────────────────
    async function loadEvents() {
      const grid = document.getElementById('events-grid');
      const errorBox = document.getElementById('events-error');
      const errorMsg = document.getElementById('events-error-msg');

      try {
        const res = await fetch(`${API_BASE}/events`);
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const events = await res.json();

        grid.innerHTML = '';

        if (events.length === 0) {
          errorBox.classList.remove('hidden');
          errorMsg.textContent = 'No events scheduled yet. Check back soon!';
          return;
        }

        errorBox.classList.add('hidden');
        grid.innerHTML = events.map((ev, i) => renderEventCard(ev, i)).join('');

        // Re-run reveal observer on new cards
        grid.querySelectorAll('.reveal').forEach(el => observer.observe(el));

      } catch (err) {
        grid.innerHTML = '';
        errorBox.classList.remove('hidden');
        errorMsg.textContent = `Could not reach the server. Make sure the backend is running at ${API_BASE}`;
        console.error('Events fetch error:', err);
      }
    }

    loadEvents();

    // ── Admin: Add Event form handler ─────────────────────────────────────────
    const addEventForm = document.getElementById('add-event-form');
    if (addEventForm) {
      addEventForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const auth = getAuth();
        if (!auth) return showToast('You must be logged in.', 'error');

        const title = document.getElementById('event-title').value.trim();
        const description = document.getElementById('event-desc').value.trim() || null;
        const startTime = document.getElementById('event-start').value;
        const isOngoing = document.getElementById('event-ongoing').checked;
        const btn = document.getElementById('event-submit-btn');

        if (!title || !startTime) {
          showToast('Title and start time are required.', 'error');
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Creating…';

        try {
          const res = await fetch(`${API_BASE}/events`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${auth.token}`,
            },
            body: JSON.stringify({
              title,
              description,
              start_time: new Date(startTime).toISOString(),
              is_ongoing: isOngoing,
            }),
          });

          const data = await res.json();

          if (res.ok) {
            showToast(`Event "${data.title}" created!`);
            addEventForm.reset();
            loadEvents(); // Refresh the grid
          } else {
            const detail = data.detail || 'Failed to create event.';
            showToast(typeof detail === 'string' ? detail : JSON.stringify(detail), 'error');
          }
        } catch (err) {
          showToast('Network error. Could not create event.', 'error');
          console.error('Create event error:', err);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Create Event';
        }
      });
    }

    // ── Admin: Add Stream form handler ────────────────────────────────────────
    const addStreamForm = document.getElementById('add-stream-form');
    if (addStreamForm) {
      addStreamForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const auth = getAuth();
        if (!auth) return showToast('You must be logged in.', 'error');

        const title = document.getElementById('stream-title').value.trim();
        const youtubeUrl = document.getElementById('stream-url').value.trim();
        const btn = document.getElementById('stream-submit-btn');

        if (!title || !youtubeUrl) {
          showToast('Title and YouTube URL are required.', 'error');
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Adding…';

        try {
          const res = await fetch(`${API_BASE}/streams`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${auth.token}`,
            },
            body: JSON.stringify({ title, youtube_url: youtubeUrl }),
          });

          const data = await res.json();

          if (res.ok) {
            showToast(`Stream "${data.title}" added!`);
            addStreamForm.reset();
          } else {
            const detail = data.detail || 'Failed to add stream.';
            showToast(typeof detail === 'string' ? detail : JSON.stringify(detail), 'error');
          }
        } catch (err) {
          showToast('Network error. Could not add stream.', 'error');
          console.error('Create stream error:', err);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Add Stream';
        }
      });
    }
  </script>
</body>
</html>
